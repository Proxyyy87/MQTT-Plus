name: Test and Release

on:
  push:
    branches:
      - "main"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: "22.x"
          type-checking: true
          lint: false

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    needs: [check-and-lint]
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          build: true

  # Deploys the final package to npm when a version tag (v1.2.3) is pushed.
  # Authentication uses the MQTT2 repository secret (npm token). The package is signed
  # with provenance via the id-token permission below, so switching to npm Trusted
  # Publishing later only means removing the npm-token input again.
  deploy:
    needs: [check-and-lint, adapter-tests]
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      # Sign the published package with provenance. This uses the id-token permission
      # above (Sigstore/OIDC) and works with token based authentication as well.
      NPM_CONFIG_PROVENANCE: true
      # Makes npm print its OIDC diagnostics ("oidc" log lines) during publish
      NPM_CONFIG_LOGLEVEL: silly
    steps:
      - name: Check OIDC availability
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "OIDC env vars present -> requesting token to inspect claims"
            CLAIMS=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const t=JSON.parse(d).value;const p=JSON.parse(Buffer.from(t.split('.')[1],'base64').toString());console.log(JSON.stringify({repository:p.repository,job_workflow_ref:p.job_workflow_ref,workflow_ref:p.workflow_ref,environment:p.environment,repository_visibility:p.repository_visibility,aud:p.aud},null,1))})")
            echo "$CLAIMS"
          else
            echo "OIDC env vars MISSING - id-token permission was not granted to this job"
          fi

      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: "24.x"
          build: true
          npm-token: ${{ secrets.MQTT2 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
